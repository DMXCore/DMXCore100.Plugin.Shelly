name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly build so the floating DMXCore.PluginSdk 1.* reference surfaces
    # breakage from new SDK releases even when this repo is idle.
    - cron: '35 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shelly-plugin
          path: artifacts/*.dmxplugin

      # Workflow artifacts expire; keep a permanent copy of the current build
      # as a single rolling release. Recreated (not appended) so the "latest"
      # tag always points at the built commit. This repo is private, so
      # downloading the asset needs an authenticated request (gh release
      # download / a token) — the main product build does exactly that when it
      # bundles the plugin.
      - name: Update rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update in place instead of delete+recreate: a product build that
          # downloads the "latest release" mid-update must never find no
          # release at all.
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest artifacts/*.dmxplugin --clobber
            gh release edit latest --notes "Automatically packaged from \`${GITHUB_SHA}\`."
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin latest
          else
            # A normal (non-prerelease) release: the DMX Core 100 product
            # build downloads it with DownloadGitHubRelease's "latest
            # release" mode, which skips prereleases.
            gh release create latest artifacts/*.dmxplugin \
              --title "Latest build" \
              --notes "Automatically packaged from \`${GITHUB_SHA}\`."
          fi
